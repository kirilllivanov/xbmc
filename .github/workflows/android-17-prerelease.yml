name: Kodi 22.0 RC2 Android 17 - C1-Pro LLVM 23 Ubuntu 26

# This workflow lives only on the branch created from Kodi 22.0 RC2.
# No master branch source or CI changes are needed.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/android17-c1pro-llvm23-ubuntu26-22.0rc2
    paths:
      - .github/workflows/android-17-prerelease.yml
      - cmake/platform/android/android.cmake
      - .github/scripts/setup-llvm23-android.sh

permissions:
  contents: read

concurrency:
  group: kodi-android-17-rc2-c1-pro-llvm23-ubuntu26
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build Kodi 22.0 RC2 Android 17 C1-Pro / LLVM 23.1.5
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      DEPS_DIR: /tmp/kodi-depends
      TARBALLS_DIR: /tmp/kodi-tarballs
      BUILD_DIR: /tmp/kodi-build
      KODI_ANDROID_STORE_FILE: /tmp/kodi-debug.keystore
      KODI_ANDROID_STORE_PASSWORD: android
      KODI_ANDROID_KEY_ALIAS: androiddebugkey
      KODI_ANDROID_KEY_PASSWORD: android
      NDK_VERSION: '30.0.16248370'
      LLVM_VERSION: '23.1.5'

    steps:
      - name: Check out C1-Pro branch based on Kodi 22.0 RC2
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10

      - name: Confirm Android 17 (API 37) and release version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d686683a55d50e576dd282f53fb2bf9914931b38 HEAD
          grep -q 'set(TARGET_SDK 37)' cmake/platform/android/android.cmake
          grep -q 'set(TARGET_MINSDK 37)' cmake/platform/android/android.cmake
          cat version.txt
          {
            echo "### Kodi Android 17 / ARM64"
            echo "Source: [22.0rc2-Piers](https://github.com/xbmc/xbmc/releases/tag/22.0rc2-Piers)"
            echo "Source is a dedicated branch based on exact Kodi 22.0 RC2 prerelease commit; not master."
            echo "Android min/compile/target SDK: 37; NDK: $NDK_VERSION; LLVM: $LLVM_VERSION; Ubuntu 26.04."
            echo "Build source commit: $(git rev-parse HEAD)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space for Kodi native toolchain
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install host build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache cmake curl flex gawk \
            git gperf lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev libtool make meson nasm ninja-build \
            pkg-config python3 python3-dev unzip yasm zip zlib1g-dev zstd

      - name: Set up Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4.0.4
        with:
          # v4 installs current command-line tools, sets ANDROID_HOME and avoids removed 'tools'.
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK setup did not set ANDROID_HOME}"
          command -v sdkmanager
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Android 17 SDK, Build-Tools and NDK r30
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          df -h .

      - name: Install and verify LLVM 23.1.5 Android C/C++ toolchain
        shell: bash
        run: |
          bash .github/scripts/setup-llvm23-android.sh

      - name: Require real C1-Pro tuning in LLVM 23.1.5 (no fallback)
        id: cpu
        shell: bash
        run: |
          set -euo pipefail
          cc="$ANDROID_LLVM_TOOLCHAIN/bin/aarch64-linux-android37-clang"
          test -x "$cc"
          "$cc" --version | grep -F "$LLVM_VERSION"
          test "$("$cc" -print-resource-dir)" = "$LLVM_RESOURCE_DIR"
          # HWCAP2 reported by the device: no MOPS or MTE.
          flags="-march=armv9.3-a+sve2+sme2+nomops+nomemtag -mtune=c1-pro -O3"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/c1-pro-compiler-probe.c"
          "$cc" $flags -c "$RUNNER_TEMP/c1-pro-compiler-probe.c" -o "$RUNNER_TEMP/c1-pro-compiler-probe.o"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "profile=c1-pro-llvm23.1.5" >> "$GITHUB_OUTPUT"
          {
            echo "### C1-Pro LLVM 23.1.5 optimizations"
            echo "Compiler: $("$cc" --version | head -n1)"
            echo "Flags: \`$flags\`"
            echo "HWCAP2: \`0x51a8bc9af3ff\`; MOPS and MTE disabled."
            echo "Parallel jobs: $(nproc) (all advertised runner CPUs)."
            echo "Compiling against NDK $NDK_VERSION, Android min/target API 37."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate test signing key for installable APK
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$KODI_ANDROID_STORE_FILE" \
            -alias "$KODI_ANDROID_KEY_ALIAS" \
            -storepass "$KODI_ANDROID_STORE_PASSWORD" \
            -keypass "$KODI_ANDROID_KEY_PASSWORD" \
            -dname 'CN=Kodi CI Debug, O=Personal Build, C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Bootstrap and configure Android ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$TARBALLS_DIR" \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/$NDK_VERSION" \
            --with-toolchain="$ANDROID_LLVM_TOOLCHAIN" \
            --with-ndk-api=37 \
            --with-target-cflags="${{ steps.cpu.outputs.flags }}" \
            --with-target-cxxflags="${{ steps.cpu.outputs.flags }}" \
            --prefix="$DEPS_DIR" \
            --enable-debug=no
          grep -F "$ANDROID_LLVM_TOOLCHAIN/bin/aarch64-linux-android37-clang" tools/depends/Makefile.include
          grep -F "$ANDROID_LLVM_TOOLCHAIN/bin/aarch64-linux-android37-clang++" tools/depends/Makefile.include

      - name: Build Kodi dependencies
        shell: bash
        run: |
          make -C tools/depends -j"$(nproc)"

      - name: Configure Kodi CMake
        shell: bash
        run: |
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Compile Kodi for Android ARM64
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      - name: Package and test-sign release APK
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --target apk --parallel "$(nproc)"
          ls -lh kodiapp-*.apk

      - name: Upload Android 17 APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kodi-android17-22.0rc2-Piers-c1pro-llvm23.1.5-ubuntu26-arm64-v8a
          path: kodiapp-*.apk
          if-no-files-found: error
          retention-days: 14
