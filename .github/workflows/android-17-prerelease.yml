name: Kodi 22.0 RC2 Android 17

# This workflow lives only on the branch created from Kodi 22.0 RC2.
# No master branch source or CI changes are needed.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/android17-22.0rc2-Piers
    paths:
      - .github/workflows/android-17-prerelease.yml

permissions:
  contents: read

concurrency:
  group: kodi-android-17-rc2
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build Kodi 22.0 RC2 for Android 17 (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEPS_DIR: /tmp/kodi-depends
      TARBALLS_DIR: /tmp/kodi-tarballs
      BUILD_DIR: /tmp/kodi-build
      KODI_ANDROID_STORE_FILE: /tmp/kodi-debug.keystore
      KODI_ANDROID_STORE_PASSWORD: android
      KODI_ANDROID_KEY_ALIAS: androiddebugkey
      KODI_ANDROID_KEY_PASSWORD: android

    steps:
      - name: Check out EXACT Kodi 22.0 RC2 prerelease commit from fork
        uses: actions/checkout@v7.0.1
        with:
          ref: d686683a55d50e576dd282f53fb2bf9914931b38
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm Android 17 (API 37) and release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd686683a55d50e576dd282f53fb2bf9914931b38'
          grep -q 'set(TARGET_SDK 37)' cmake/platform/android/android.cmake
          cat version.txt
          {
            echo "### Kodi Android 17 / ARM64"
            echo "Source: [22.0rc2-Piers](https://github.com/xbmc/xbmc/releases/tag/22.0rc2-Piers)"
            echo "Source is an immutable prerelease tag, **not** the master branch."
            echo "Android compile/target SDK: 37; NDK: 28.2.13676358."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space for Kodi native toolchain
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install host build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache cmake curl flex gawk \
            git gperf lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev libtool make meson nasm ninja-build \
            pkg-config python3 python3-dev unzip yasm zip zlib1g-dev

      - name: Set up Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4.0.4
        with:
          # v4 installs current command-line tools, sets ANDROID_HOME and avoids removed 'tools'.
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK setup did not set ANDROID_HOME}"
          command -v sdkmanager
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Android 17 SDK, Build-Tools and Kodi NDK r28c
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;28.2.13676358'
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          df -h .

      - name: Generate test signing key for installable APK
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$KODI_ANDROID_STORE_FILE" \
            -alias "$KODI_ANDROID_KEY_ALIAS" \
            -storepass "$KODI_ANDROID_STORE_PASSWORD" \
            -keypass "$KODI_ANDROID_KEY_PASSWORD" \
            -dname 'CN=Kodi CI Debug, O=Personal Build, C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Bootstrap and configure Android ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$TARBALLS_DIR" \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/28.2.13676358" \
            --with-ndk-api=24 \
            --prefix="$DEPS_DIR" \
            --enable-debug=no

      - name: Build Kodi dependencies
        shell: bash
        run: |
          make -C tools/depends -j2

      - name: Configure Kodi CMake
        shell: bash
        run: |
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Compile Kodi for Android ARM64
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --parallel 2

      - name: Package and test-sign release APK
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --target apk --parallel 2
          ls -lh kodiapp-*.apk

      - name: Upload Android 17 APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kodi-android17-22.0rc2-Piers-arm64-v8a
          path: kodiapp-*.apk
          if-no-files-found: error
          retention-days: 14
